publiccodeYmlVersion: "0.4"
name: FPSOT RESTful API specification
url: "https://github.com/fpsot-org/fpsot-spec-api-restful"
platforms:
  - web
categories:
  - it-development
developmentStatus: concept
softwareType: "standalone/other"
description:
  en:
    shortDescription: Common rules for the REST APIs of FPSOT specifications.
    longDescription: >
      Common rules for every HTTP API that an FPSOT specification defines:
      HTTP methods and status codes, resource paths, OpenAPI 3.1
      descriptions, errors as problem details, cursor pagination, filters
      and sorting, versions and deprecation, idempotent retries, languages,
      transport security, access control, rate limits and CloudEvents events.
    features:
      - OpenAPI 3.1 descriptions and problem details errors
      - Cursor pagination, versioning and safe retries
      - Bilingual content and security baseline
  fr:
    shortDescription: Règles communes des API REST des spécifications de FPSOT.
    longDescription: >
      Règles communes à toute API HTTP que définit une spécification de
      FPSOT : méthodes et codes d'état HTTP, chemins des ressources,
      descriptions OpenAPI 3.1, erreurs en détails de problème, pagination
      par curseur, filtres et tris, versions et retrait, nouvelles tentatives
      idempotentes, langues, sécurité du transport, contrôle d'accès, limites
      de débit et événements CloudEvents.
    features:
      - Descriptions OpenAPI 3.1 et erreurs en détails de problème
      - Pagination par curseur, gestion des versions et nouvelles tentatives sûres
      - Contenu bilingue et sécurité de base
legal:
  license: Community-Spec-1.0
maintenance:
  type: community
localisation:
  localisationReady: true
  availableLanguages:
    - en
    - fr
